<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="impact-site-verification" value="41d22dc2-6c8f-442d-9297-7a341e77d2f9">
<title>Meal Planner Plus</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Inter:wght@400;500;600&display=swap">
<style id="app-css">
:root{--bg:#f6f3ec;--ink:#1f2a24;--muted:#6b746e;--card:#fff;--line:#e5dfd3;--accent:#2f5d46;--accent-ink:#fff;--soft:#e4ece6;--warm:#b8582f;--warm-soft:#f6e6dc;--r:14px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:650;letter-spacing:-.01em;margin:0}
a{color:var(--accent)}
.top{position:sticky;top:0;z-index:20;background:rgba(246,243,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px}
.brand{font-family:Fraunces,Georgia,serif;font-size:21px;font-weight:650;flex:1}
.brand span{color:var(--warm)}
.tabs{display:flex;gap:4px}
.tabs.mob{display:none}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.tab.on{background:var(--ink);color:#fff}
.tab .ic{display:none}
.savepill{border:0;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;background:var(--warm);color:#fff}
.savepill.ok{background:transparent;color:var(--muted);font-weight:500;cursor:default}
main{max-width:980px;margin:0 auto;padding:16px 16px 110px}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:14px}
.bar .grow{flex:1}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:500;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
.btn:hover{border-color:#cfc7b8}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.warm{background:var(--warm);border-color:var(--warm);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.sm{padding:5px 9px;font-size:13px;border-radius:8px}
.btn.big{padding:13px 16px;font-size:16px;border-radius:12px;width:100%;justify-content:center}
.btn:disabled{opacity:.5;cursor:default}
.seg{display:inline-flex;background:#ebe6db;border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:8px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.nav{display:flex;align-items:center;gap:4px}
.nav .lbl{font-family:Fraunces,Georgia,serif;font-size:18px;min-width:150px;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:10px;display:inline-grid;place-items:center;font-size:16px}
.days{display:grid;gap:10px}
.day{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;grid-template-columns:72px 1fr;gap:10px;align-items:start}
.day.today{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.dname{font-weight:600}
.ddate{color:var(--muted);font-size:13px}
.slots{display:grid;gap:6px}
.slot{width:100%;text-align:left;border:1px dashed #d6cfc1;background:transparent;border-radius:10px;padding:9px 11px;color:var(--muted);display:flex;gap:8px;align-items:center}
.slot.full{border-style:solid;border-color:transparent;background:var(--soft);color:var(--ink)}
.slot .meal{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:64px}
.slot .rn{font-weight:600;flex:1}
.slot .sv{font-size:12px;color:var(--muted)}
.month{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mh{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.mc{min-height:86px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;text-align:left;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.mc.blank{background:transparent;border-color:transparent}
.mc.today{border-color:var(--accent)}
.mc .n{font-size:12px;font-weight:600;color:var(--muted)}
.mc .m{font-size:11.5px;line-height:1.25;background:var(--soft);border-radius:6px;padding:2px 4px;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.card h3{font-size:17px}
.meta{color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tm{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.04em;background:#1f2a24;color:#fff;border-radius:6px;padding:1px 6px;vertical-align:2px}
.chkline{display:flex;gap:8px;align-items:center;font-weight:500;margin-bottom:12px}
.chkline input{width:18px;height:18px;accent-color:var(--accent)}
.pr{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
.pr b{font-weight:600}
.pr .win{color:var(--accent);font-weight:700}
.sp{font-size:10.5px;font-weight:700;background:#ffe14d;color:#2b2400;border-radius:5px;padding:0 5px}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.cmpc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.cmpc.best{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cmpc .t{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cmpc .v{font-family:Fraunces,Georgia,serif;font-size:24px}
.seg.wrap{flex-wrap:wrap}
.fit{font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px}
.fit.ok{background:var(--soft);color:var(--accent)}
.fit.no{background:var(--warm-soft);color:#8a3d1c}
.carb{font-size:11.5px;color:#5b625d;background:#efeae0;border-radius:999px;padding:1px 8px}
.lbl{font-size:11px;font-weight:600;background:#fff4c2;color:#5e4b00;border-radius:5px;padding:0 6px}
.badrow{font-size:12px;color:#8a3d1c}
.ingx{color:#8a3d1c}.ingm{color:#7a6400}
.swap{font-size:12.5px;color:var(--accent)}
details.guide{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
details.guide summary{cursor:pointer;padding:11px 14px;font-weight:600;list-style:none}
details.guide summary::-webkit-details-marker{display:none}
details.guide summary:after{content:'+';float:right;color:var(--muted)}
details.guide[open] summary:after{content:'–'}
details.guide .gb{padding:0 14px 12px;font-size:14px}
details.guide .gb ul{padding-left:18px;margin:6px 0}
details.bal{margin-top:14px}
.brow{display:flex;gap:8px;align-items:baseline;padding:4px 0;flex-wrap:wrap}
.brow .meta{margin-left:auto;font-size:12px}
.bi{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.bi.ok{background:var(--soft);color:var(--accent)}.bi.warn{background:var(--warm-soft);color:#8a3d1c}
.exp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.exp h3{font-size:17px;margin-bottom:4px}
.snap{background:#fff;color:#000;border-radius:12px;padding:18px 20px;font:600 19px/1.55 Inter,system-ui,sans-serif}
.snap .sh{font-size:13px;letter-spacing:.08em;color:#555;margin-top:10px}
.slot .warnf{color:#8a3d1c;font-size:12px;font-weight:500}
.pastebox{min-height:52px;border:1px dashed #cfc7b8;border-radius:10px;padding:10px 12px;background:var(--card);margin-bottom:6px;font-size:14px;-webkit-user-select:text;user-select:text}
.pastebox:empty:before{content:attr(data-ph);color:var(--muted)}
.filebtn{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:13px 16px;border-radius:12px;background:var(--accent);color:#fff;font-weight:600;margin-bottom:8px}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:200px}
.slot.lo{background:#fbefe2}
.slot .sub{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px;font-weight:400}
.hero{position:relative;border-radius:18px;overflow:hidden;margin-bottom:14px;aspect-ratio:1500/619;background:#1f2a24;box-shadow:0 8px 24px rgba(31,42,36,.18)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero-t{position:absolute;right:4%;top:8%;text-align:right;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.5);max-width:50%}
.hero h1{font-size:clamp(24px,4.4vw,46px);line-height:1.05;color:#fff}
.hero-s{font:500 clamp(11.5px,1.5vw,15px)/1.35 Inter,system-ui,sans-serif;opacity:.95;margin-top:6px}
@media(max-width:719px){.hero{aspect-ratio:auto;height:200px}.hero img{object-position:20% 50%}.hero-t{top:12px;right:14px;max-width:58%}}
.tagc{font-size:11.5px;background:#efeae0;border-radius:999px;padding:2px 8px;color:#5b625d}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px}
.sec{margin:18px 0 6px;display:flex;align-items:baseline;gap:8px}
.sec h3{font-size:16px}
.sec .meta{font-size:12px}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid #f0ebe1}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0}
.row .nm{font-weight:500}
.row .from{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .qty{font-variant-numeric:tabular-nums;color:var(--ink);font-size:13.5px;white-space:nowrap}
.row.got .nm,.row.got .qty{text-decoration:line-through;color:var(--muted)}
.chk{width:22px;height:22px;border-radius:7px;border:1.5px solid #c9c1b2;background:#fff;display:grid;place-items:center;flex:none;padding:0;color:#fff;font-size:13px}
.chk.on{background:var(--accent);border-color:var(--accent)}
.addrow{display:flex;gap:8px;margin-top:10px}
.note{background:var(--warm-soft);border-radius:12px;padding:10px 12px;font-size:13.5px;color:#6a3a22;margin-bottom:12px}
.note.soft{background:var(--soft);color:#2d4a3a}
.empty{text-align:center;color:var(--muted);padding:40px 16px;background:var(--card);border:1px dashed var(--line);border-radius:var(--r)}
.progress{height:6px;background:#ebe6db;border-radius:999px;overflow:hidden;margin:6px 0 14px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:999px}
.modal-bg{position:fixed;inset:0;background:rgba(25,30,27,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px 24px;box-shadow:0 -10px 40px rgba(0,0,0,.15)}
@media(min-width:720px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.mhd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mhd h2{flex:1;font-size:20px}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 11px;width:100%}
.field textarea{min-height:120px;resize:vertical;font-size:14px;line-height:1.5}
.hint{font-size:12px;color:var(--muted)}
.pick{display:grid;gap:6px;max-height:46vh;overflow:auto;margin-top:8px}
.pick button{text-align:left;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;display:flex;gap:8px;align-items:center}
.pick button.cur{border-color:var(--accent);background:var(--soft)}
.pick .meta{margin-left:auto}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.stepper button{border:0;background:none;width:34px;height:34px;font-size:18px}
.stepper span{min-width:28px;text-align:center;font-weight:600}
.ingl{margin:0;padding-left:18px}
.ingl li{margin:2px 0}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:10px;font-size:14px;z-index:60;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(max-width:719px){
 .tabs.desk{display:none}
 .tabs.mob{display:flex;position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:30}
 .tab{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;padding:4px 10px;border-radius:10px}
 .tab .ic{display:block;font-size:19px;line-height:1.1}
 .tab.on{background:var(--soft);color:var(--accent)}
 .nav .lbl{min-width:0;font-size:16px}
 .day{grid-template-columns:1fr}
 .day .dh{display:flex;gap:8px;align-items:baseline}
 .mc{min-height:62px}
 .mc .m{font-size:10.5px;-webkit-line-clamp:3}
}
.prep{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-top:16px}
.prepl{display:grid;gap:8px}
.prepit{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--soft);border-radius:10px;padding:8px 10px}
.prepit.made{opacity:.75}
.prepit .pi-n{flex:1 1 180px;min-width:0;text-align:left;background:none;border:0;padding:0;display:flex;flex-direction:column;gap:2px;color:var(--ink);font:inherit;cursor:pointer}
.prepit .pi-n .meta{font-size:12px}
.prepit .pi-a{display:flex;gap:6px;align-items:center}

.stepper.sm button{width:28px;height:28px;font-size:16px}

.costsum{margin-top:12px;font-size:14px;background:var(--soft);border-radius:12px;padding:10px 12px}
.slot .kc{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.dnut{font-size:11.5px;color:var(--muted);padding:6px 2px 0;border-top:1px dashed var(--line);margin-top:6px}

.nb{height:8px;background:var(--soft);border-radius:6px;overflow:hidden}
.nf{display:block;height:100%;border-radius:6px;background:var(--accent)}

.kchip.nobody{opacity:.6;font-style:italic}
.kchip{display:inline-block;margin-left:auto;border:1px solid var(--line);background:var(--card);border-radius:999px;font-size:11.5px;padding:3px 9px;color:var(--ink);white-space:nowrap}

.btn.warnb{background:#b3261e;color:#fff;border-color:#b3261e}

.cut{font-weight:600;color:var(--accent)}.cua{font-size:11.5px;background:var(--soft);border-radius:6px;padding:2px 6px;text-align:center}

  return web.filter(function(x){return x&&x.url&&!/\/(collections|blogs?|search|pages|recipes|category|browse)\b/i.test(x.url)&&!/everyday market|sold and shipped by/i.test(x.description||'')}).map(function(x){var t=String(x.title||'').replace(/\s*\|\s*[^|]*$/,'').replace(/\s*[-–]\s*(woolworths|coles|aldi)\s*$/i,'').slice(0,90);return {url:x.url,title:t,size:sizeFrom(t)}})})}

  case 'tsave':readTargets();S.settings.people=ui.modal.people;syncHeadcounts(false,todayKey);if(S.settings.people.length>(S.settings.household||0))S.settings.household=S.settings.people.length;ui.prof=0;ui.modal=null;toast('Targets saved');change();break;
  case 'mfp':var mk=rangeDays().map(dkey).filter(function(k){return dayNut(k).n||(S.plan[k]&&Object.keys(S.plan[k]).length)});var m0=mk.indexOf(todayKey)>=0?todayKey:mk[0];if(!m0){toast('Plan some meals first');break}ui.modal={type:'mfp',days:mk,k:m0,text:mfpText(m0,curProf())};render();break;
  case 'mfpday':ui.modal.k=v;ui.modal.text=mfpText(v,curProf());render();break;
  case 'mfprec':var mr=rec(v);if(mr){ui.modal={type:'mfp',text:mfpRecipe(mr)};render()}break;
  case 'mfpcopy':var mt=ui.modal.text;var ta=document.getElementById('mfptxt');try{navigator.clipboard.writeText(mt).then(function(){toast('Copied')},function(){if(ta){ta.select();toast('Select-all done — tap Copy in the menu')}})}catch(e){if(ta)ta.select()}break;
  case 'clearmeal':ui.modal={type:'clearmeal',meal:v,fromToday:false};render();break;
  case 'cmscope':ui.modal.fromToday=v==='today';render();break;
  case 'docm':var cmm=ui.modal;var cfrom=cmm.fromToday?todayKey:'0000-00-00';Object.keys(S.plan).forEach(function(k){if(k>=cfrom&&S.plan[k][cmm.meal])releaseLeftover(k,cmm.meal)});var cnn=clearFrom(cfrom,'',cmm.meal,true);if(v==='hide'){S.settings.meals=S.settings.meals.filter(function(x){return x!==cmm.meal})}ui.modal=null;toast('Cleared '+cnn+' '+mealPl(cmm.meal).toLowerCase()+(v==='hide'?' · '+cmm.meal+' row hidden':''));change();break;
  case 'clearfrom':ui.modal={type:'clearfrom',from:todayKey,to:'',meal:'All'};render();break;
  case 'cfmeal':var cf=ui.modal;var fe=document.getElementById('f-from'),te=document.getElementById('f-to');if(fe)cf.from=fe.value;if(te)cf.to=te.value;cf.meal=v;render();break;
  case 'doclearfrom':var fm=ui.modal;var f1=(document.getElementById('f-from')||{}).value||'',t1=(document.getElementById('f-to')||{}).value||'';if(!/^\d{4}-\d{2}-\d{2}$/.test(f1)){toast('Pick a start date');return}if(t1&&t1<f1){toast('“To” is before “From”');return}
   var nclr=clearFrom(f1,t1,fm.meal,false);if(!nclr){toast('No meals planned in that range');return}
   ui.modal={type:'confirm',title:'Clear '+nclr+' meal'+(nclr>1?'s':'')+'?',body:'Removes '+(fm.meal&&fm.meal!=='All'?fm.meal.toLowerCase()+' ':'')+'meals planned from '+fmtDay(pkey(f1))+(t1?' to '+fmtDay(pkey(t1)):' onwards')+'. Recipes are kept.',yes:'Clear',act:'clearfrom',from:f1,to:t1,meal:fm.meal};render();break;
  case 'dietbase':S.diet.base=v;change();break;
  case 'diettog':S.diet[v]=!S.diet[v];change();break;
  case 'dietex':var ex2=S.diet.excl||(S.diet.excl=[]);var ix=ex2.indexOf(v);if(ix>=0)ex2.splice(ix,1);else ex2.push(v);change();break;
  case 'dietbutter':S.diet.butter=!!t.checked;change();break;
  case 'dietcarbs':S.diet.carbs=Math.max(20,Math.min(100,(S.diet.carbs||30)+Number(v)));change();break;
  case 'adapt':adaptAI(v);break;
  case 'makefit':var r0=rec(v);if(r0){var mf=makeFit(r0);var nr={id:uid(),name:r0.name+' ('+dietLabel()+')',serves:r0.serves,tags:(r0.tags||[]).slice(),ingredients:mf.ingredients,method:(r0.method||'')+(mf.changes.length?'\n\nSwaps: '+mf.changes.join('; ')+'.':'')+(mf.stuck.length?'\nStill check: '+mf.stuck.join(', ')+'.':''),tm:!!r0.tm,link:r0.link||''};S.recipes.unshift(nr);ui.modal={type:'viewrec',id:nr.id};toast(mf.changes.length+' swap'+(mf.changes.length===1?'':'s')+' made'+(mf.stuck.length?' — '+mf.stuck.length+' still to sort':''));change()}break;
  case 'tmstarters':TM_SEED.forEach(function(x){S.recipes.unshift(mkRec(x,true))});ui.rf='tm';toast('Added 3 Thermomix recipes');change();break;
  case 'totm':toThermomix(v);break;
  case 'bulk':ui.modal={type:'bulk'};render();break;
  case 'dobulk':var bt=document.getElementById('f-bulk');var lines=(bt?bt.value:'').split('\n').map(function(l){return l.replace(/^\s*(?:[-•*]|\[\s*x?\s*\])\s*/i,'').trim()}).filter(Boolean);var added=0;lines.forEach(function(l){var pp=parseLine(l);if(pp&&pp.n){S.extras.push(pp);added++}});ui.modal=null;toast('Added '+added+' item'+(added===1?'':'s'));change();break;
  case 'doimport':doImport();break;
  case 'linkgo':linkGo();break;
  case 'got':if(S.got[v])delete S.got[v];else S.got[v]=true;change();break;
  case 'topantry':var it=buildList().filter(function(x){return x.k===v})[0];if(it&&!inPantry(it.name))S.pantry.push(it.name);toast('“'+(it?it.name:v)+'” moved to pantry staples');change();break;
  case 'frompantry':S.pantry=S.pantry.filter(function(p){return p.toLowerCase()!==v});change();break;
  case 'clearticks':S.got={};change();break;
  case 'addextra':var inp=document.getElementById('extra');var p=parseLine(inp?inp.value:'');if(p){if(multiK())p.k=listKitchen();S.extras.push(p);ui.extra='';ui.focus='extra';change()}break;
  case 'rmextra':S.extras.splice(Number(v),1);change();break;
  case 'store':S.settings.store=v;change();break;
  case 'copy':var txt=listText();try{navigator.clipboard.writeText(txt).then(function(){toast('List copied')},function(){toast('Copy blocked by the browser')})}catch(e){toast('Copy blocked by the browser')}break;
 }
});
function tryBarcode(){var m=ui.modal;if(!m||m.type!=='food'||!m.files||!m.files.length||m.code||!('BarcodeDetector' in window))return;try{var bd=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']});m.files.forEach(function(f){createImageBitmap(f).then(function(b){return bd.detect(b)}).then(function(r){if(r&&r[0]&&ui.modal===m&&!m.code){m.code=r[0].rawValue;render()}}).catch(function(){})})}catch(e){}}
function addScanFiles(fs){var m=ui.modal;if(!photoModal())return;var max=ui.imgMax||4,added=0;fs.forEach(function(f){if(m.files.length<max&&/^image\//.test(f.type||'image/')){m.files.push(f);try{m.thumbs.push(URL.createObjectURL(f))}catch(e){}added++}});if(fs.length&&!added)toast(m.files.length>=max?'Up to '+max+' photos at a time':'That isn’t a photo');m.results=null;m.food=null;tryBarcode();render()}
document.addEventListener('paste',function(ev){if(!photoModal())return;var items=(ev.clipboardData&&ev.clipboardData.items)||[];var fs=[];for(var i=0;i<items.length;i++){if(items[i].kind==='file'){var f=items[i].getAsFile();if(f)fs.push(f)}}if(fs.length){ev.preventDefault();addScanFiles(fs)}else if(ev.target&&ev.target.id==='scanpaste'){ev.preventDefault();toast('No photo on the clipboard — copy the photo first')}});
document.addEventListener('change',function(ev){if(ev.target&&ev.target.id==='herofile'&&ui.modal&&ui.modal.type==='hero'){var f=ev.target.files&&ev.target.files[0];if(f)heroPrep(f)}});
document.addEventListener('paste',function(ev){if(!(ui.modal&&ui.modal.type==='hero'))return;var items=(ev.clipboardData&&ev.clipboardData.items)||[];for(var i=0;i<items.length;i++){if(items[i].kind==='file'){var f=items[i].getAsFile();if(f){ev.preventDefault();heroPrep(f);return}}}if(ev.target&&ev.target.id==='heropaste'){ev.preventDefault();toast('No photo on the clipboard — copy the photo first')}});
document.addEventListener('change',function(ev){var id=ev.target&&ev.target.id;if(!ui.modal||ui.modal.type!=='prod')return;if(id==='p-cat')ui.modal.catSet=true;if(id==='p-name'&&ui.modal.isNew&&!ui.modal.catSet){var pc=document.getElementById('p-cat');if(pc)pc.value=guessCat(ev.target.value)}if(id==='p-name'||id==='p-sup'||id==='p-brand'){var u=document.getElementById('p-url');if(id==='p-sup'||!(u&&u.value.trim())||ui.modal.autoUrl){if(id==='p-sup'){if(u)u.value='';var af=ui.modal.af||{};['brand','size','price'].forEach(function(k){if(af[k]){var el=document.getElementById('p-'+k);if(el)el.value=''}});ui.modal.af={};ui.modal.cands=null;ui.modal.picked=null}ui.modal.autoUrl=true;prodFind(true)}}});
document.addEventListener('change',function(ev){if(ev.target&&ev.target.id==='rf-gear'){ui.rfG=ev.target.value;render()}});
document.addEventListener('dragover',function(ev){if(photoModal())ev.preventDefault()});
document.addEventListener('drop',function(ev){if(!photoModal())return;ev.preventDefault();addScanFiles(Array.prototype.slice.call((ev.dataTransfer&&ev.dataTransfer.files)||[]))});
document.addEventListener('change',function(ev){if(ev.target&&ev.target.id==='scanfile'&&photoModal()){var m=ui.modal;var fs=Array.prototype.slice.call(ev.target.files||[]);var max=ui.imgMax||4;fs.forEach(function(f){if(m.files.length<max&&/^image\//.test(f.type||'image/')){m.files.push(f);try{m.thumbs.push(URL.createObjectURL(f))}catch(e){}}});if(fs.length&&m.files.length>=max)toast('Up to '+max+' photos at a time');m.results=null;m.food=null;tryBarcode();render()}});
document.addEventListener('input',function(ev){var k=ev.target.getAttribute&&ev.target.getAttribute('data-in');if(!k)return;
 if(k==='rq'){ui.rq=ev.target.value;ui.focus='rq';render()}
 else if(k==='pq'){ui.modal.q=ev.target.value;ui.focus='pq';render()}
 else if(k==='fq'){ui.fq=ev.target.value;ui.focus='fq';render()}
 else if(k==='title'){S.settings.title=ev.target.value;dirty=true;persistDraft();pushSoon();var hb=document.querySelector('.brand');if(hb)hb.innerHTML=brandHtml();var ht=document.querySelector('.hero h1');if(ht)ht.textContent=S.settings.title||'Our Kitchen'}
 else if(k==='extra'){ui.extra=ev.target.value}
 else if(k==='cow'){S.events=S.events||{};S.events.cow=S.events.cow||{};var cv=parseFloat(ev.target.value);if(!isNaN(cv)){S.events.cow[ev.target.getAttribute('data-k')]=cv;dirty=true;persistDraft();pushSoon();clearTimeout(ui.cowT);ui.cowT=setTimeout(function(){var y=window.scrollY;render();window.scrollTo(0,y)},700)}}
 else if(k==='tg'&&ui.modal&&ui.modal.type==='targets'){readTargets();var ti=+ev.target.getAttribute('data-i');var tpx=ui.modal.people[ti];var tmc=macroCalc(tpx);var ae=document.getElementById('t-'+tmc.auto+ti);if(ae)ae.value=tpx.mode==='pct'?tmc.pct[tmc.auto]:tmc.g[tmc.auto];var se=document.getElementById('t-sum'+ti);if(se)se.innerHTML=tgSummary(tpx)}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&ev.target.id==='f-implink'){ev.preventDefault();linkGo();return}if(ev.key==='Enter'&&ev.target.id==='extra'){ev.preventDefault();var b=document.querySelector('[data-a="addextra"]');if(b)b.click()}if(ev.key==='Escape'&&ui.modal){ui.modal=null;render()}});
persistDraft();
render();
})();
